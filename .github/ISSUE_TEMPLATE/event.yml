name: カレンダー予定を登録
description: 公開カレンダーへ掲載する予定を登録します
title: "[予定] "
labels:
  - calendar:event
  - calendar:schema-v3
body:
  - type: markdown
    attributes:
      value: |
        入力した内容は公開ICSに掲載されます。機密情報や個人情報は記載しないでください。
        日時は選択したタイムゾーンの時刻として解釈されます。
  - type: input
    id: start
    attributes:
      label: 開始
      description: 時刻ありは YYYY-MM-DD HH:MM、終日予定は YYYY-MM-DD
      placeholder: "2026-09-01 10:00"
    validations:
      required: true
  - type: input
    id: end
    attributes:
      label: 終了
      description: 時刻ありは YYYY-MM-DD HH:MM、終日予定は最終日（1日の予定なら開始日と同じ）
      placeholder: "2026-09-01 11:00"
    validations:
      required: true
  - type: dropdown
    id: timezone
    attributes:
      label: タイムゾーン
      options:
        - Asia/Tokyo
        - UTC
        - America/New_York
        - Europe/London
    validations:
      required: true
  - type: checkboxes
    id: all_day
    attributes:
      label: 終日予定
      options:
        - label: 終日予定として登録する
  - type: dropdown
    id: recurrence
    attributes:
      label: 繰り返し
      description: 開始日時を基準に、指定した終了条件まで繰り返します
      options:
        - なし
        - 毎週（開始と同じ曜日）
        - 毎月（開始と同じ日）
      default: 0
    validations:
      required: true
  - type: dropdown
    id: recurrence_end
    attributes:
      label: 繰り返しの終了
      description: 「繰り返し」が「なし」の場合は「終了なし」のままにしてください
      options:
        - 終了なし
        - 回数を指定
        - 日付を指定
      default: 0
    validations:
      required: true
  - type: input
    id: recurrence_count
    attributes:
      label: 繰り返し回数
      description: 「回数を指定」を選んだ場合だけ、最初の予定を含む回数を1以上の整数で入力
      placeholder: "10"
  - type: input
    id: recurrence_until
    attributes:
      label: 繰り返し終了日
      description: 「日付を指定」を選んだ場合だけ、最後に繰り返しを許可する日を YYYY-MM-DD で入力
      placeholder: "2026-12-31"
  - type: input
    id: location
    attributes:
      label: 場所
      placeholder: 第1会議室 / オンライン
  - type: input
    id: url
    attributes:
      label: 関連URL
      placeholder: https://example.com/meeting
  - type: textarea
    id: description
    attributes:
      label: 説明
      description: 公開カレンダーに掲載する説明
  - type: markdown
    attributes:
      value: |
        作成後、`group:<英小文字・数字・ハイフン>` ラベルでグループ、`type:<名前>` ラベルで種別を設定できます。
