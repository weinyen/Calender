name: Publish calendar

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "github_calendar/**"
      - ".github/workflows/publish-calendar.yml"

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Generate calendars
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m github_calendar.generate
          --repository "${{ github.repository }}"
          --token "$GH_TOKEN"
          --output public
          --summary "$GITHUB_STEP_SUMMARY"
          --validation-report validation-report.json
      - name: Update Issue validation feedback
        if: ${{ always() && hashFiles('validation-report.json') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m github_calendar.feedback
          --repository "${{ github.repository }}"
          --token "$GH_TOKEN"
          --report validation-report.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
